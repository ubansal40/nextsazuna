name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Runs first and is the cheapest check: if the design tokens have drifted
      # from the Ceremony spec, nothing downstream is worth running.
      - name: Design token parity
        run: npm run check:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require real credentials. If this starts failing,
          # something is reading the database at module scope instead of inside a
          # request — fix the import, do not add secrets here.
          NODE_ENV: production

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # This repo commits directly to main, so a pull-request-only check never
      # ran. Commit messages are load-bearing now that `Closes #12` is what
      # moves an issue (ADR 0008), so both paths are checked.
      - name: Lint commit messages (pull request)
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      # `before` is all-zeroes on a branch's first push and on a force push;
      # there is no range to check in that case.
      - name: Lint commit messages (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: npx commitlint --from ${{ github.event.before }} --to ${{ github.sha }} --verbose
