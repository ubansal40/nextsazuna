name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Runs first and is the cheapest check: if the design tokens have drifted
      # from the Ceremony spec, nothing downstream is worth running.
      - name: Design token parity
        run: npm run check:tokens

      # These three exercise the parts that cannot be tested end to end without
      # a live gateway, a mail server or a real order. They ran only in `npm run
      # verify` locally, which meant CI would happily go green on a change that
      # broke payment signing or the guest-lookup access control.
      # A Server Component reading a plain value out of a "use client" module
      # type-checks, builds, and then 500s at runtime, because Next replaces
      # those exports with client-reference proxies. SORT_VALUES shipped that
      # way and crashed every listing carrying a ?sort= parameter.
      - name: Server/client boundary
        run: npm run check:client-boundary

      - name: Payment signature checks
        run: npm run check:payments

      - name: Order email checks
        run: npm run check:emails

      - name: Order lookup checks
        run: npm run check:orders

      # The concurrency assertion inside this one needs a database and skips
      # itself without credentials, which CI does not have. The pure rules —
      # code generation, hashing, the buyer-safe projection — still run.
      - name: Sign-in checks
        run: npm run check:auth

      # The admin authorization boundary. Its lockout race needs a database and
      # skips itself without credentials; the pure rules — deny-by-default
      # gating, the fail-closed grant parser, the buffer-safe projection, the
      # unknown-email/wrong-password decision table — still run.
      - name: Admin auth checks
        run: npm run check:admin-auth

      # The only place author-supplied text becomes HTML, and it carries no
      # sanitiser by design — escaping precedes every formatting rule.
      - name: Journal renderer checks
        run: npm run check:blog

      # Runs the real sharp pipeline on generated images. Beyond "it made an
      # AVIF": a blank SKU stamp is not an exception — pango returns a
      # transparent bitmap when no mono font is installed — so the same photo
      # stamped with two SKUs must differ, and the concurrency gate that keeps
      # sharp from OOM-killing the box is exercised here too.
      - name: Product image pipeline checks
        run: npm run check:images

      # The pricing formula is author-supplied and evaluated — the sandbox is a
      # security boundary, so it is fuzzed against injection here.
      - name: Pricing formula checks
        run: npm run check:pricing

      # The stock sync flips is_active across the whole catalogue from one
      # uploaded column, so a parser bug takes the shop offline rather than
      # rendering a wrong pixel. The hand-rolled CSV reader is fuzzed here.
      - name: Stock sheet parsing checks
        run: npm run check:stock

      # The admin can edit line prices, discounts and promo codes on a live
      # order; this arithmetic decides what the customer is charged, so it is
      # tested against the failure it exists to prevent — binary floating point.
      - name: Order money checks
        run: npm run check:order-money

      # The inventory sheet fills purity and four weights into a product card,
      # and a pricing rule then derives the sale price from those weights. A
      # column detected one position out prices jewellery from the wrong number.
      - name: SKU sheet parsing checks
        run: npm run check:sku-sheet

      # The homepage is one admin-authored JSON block, and the parser drops
      # anything malformed in silence — a section simply stops appearing, with
      # nothing thrown and nothing logged. This round-trips every block the
      # admin builder can create through the real parser, so an editor that
      # emits a shape the homepage will not draw fails here instead of on the
      # shop.
      - name: Homepage content checks
        run: npm run check:content

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require real credentials. If this starts failing,
          # something is reading the database at module scope instead of inside a
          # request — fix the import, do not add secrets here.
          NODE_ENV: production

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only meaningful on a PR, where there is a range to check.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
