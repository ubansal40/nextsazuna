name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Runs first and is the cheapest check: if the design tokens have drifted
      # from the Ceremony spec, nothing downstream is worth running.
      - name: Design token parity
        run: npm run check:tokens

      # These three exercise the parts that cannot be tested end to end without
      # a live gateway, a mail server or a real order. They ran only in `npm run
      # verify` locally, which meant CI would happily go green on a change that
      # broke payment signing or the guest-lookup access control.
      - name: Payment signature checks
        run: npm run check:payments

      - name: Order email checks
        run: npm run check:emails

      - name: Order lookup checks
        run: npm run check:orders

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # The build must not require real credentials. If this starts failing,
          # something is reading the database at module scope instead of inside a
          # request — fix the import, do not add secrets here.
          NODE_ENV: production

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # Only meaningful on a PR, where there is a range to check.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint commit messages
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
